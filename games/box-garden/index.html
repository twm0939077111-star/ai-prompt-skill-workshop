<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>箱子小花園 · 推箱子</title>
<style>
:root{--ink:#244b42;--muted:#73877b;--green:#356e54;--cream:#faf8ee;--line:#dce5d5}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:"Microsoft JhengHei",system-ui,sans-serif;background-image:radial-gradient(#acbfa644 .8px,transparent .8px);background-size:18px 18px}button{font:inherit;cursor:pointer;touch-action:manipulation;color:inherit;border:1px solid var(--line);border-radius:14px;background:#fffdf5;transition:transform .12s,background .12s}button:hover{background:#eaf0de}button:active{transform:translateY(2px)}button:focus-visible{outline:3px solid #edab42;outline-offset:3px}button:disabled{opacity:.4;cursor:default}header{max-width:1180px;margin:auto;padding:26px 32px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;font-size:20px;letter-spacing:1px}.brand span{display:inline-grid;place-items:center;background:var(--green);color:white;width:34px;height:34px;border-radius:11px;margin-right:10px}.edition{font-size:11px;letter-spacing:3px;color:var(--muted)}main{max-width:1120px;margin:12px auto 30px;padding:0 24px;display:grid;grid-template-columns:290px 1fr;gap:38px}.eyebrow{font-size:11px;letter-spacing:3px;color:var(--green);font-weight:bold}h1{font-size:44px;line-height:1.25;margin:16px 0}.intro{font-size:14px;line-height:1.9;color:#657e70}.levels{display:grid;gap:10px;margin:26px 0}.level{padding:15px;display:flex;align-items:center;gap:13px;text-align:left}.level .num{font-size:22px;color:#a2b597;font-weight:bold}.level strong{display:block;font-size:15px}.level small{font-size:11px;color:#798875}.level.active{background:var(--green);color:white;border-color:var(--green);box-shadow:0 7px 16px #356e541c}.level.active small,.level.active .num{color:#d7e6c7}.badge{margin-left:auto;font-size:18px}.rules{border-top:1px solid var(--line);padding-top:18px;font-size:12px;line-height:1.95;color:#637b6c}.rules b{color:var(--ink)}.play-area{min-width:0}.topline{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.topline h2{font-size:19px;margin:0}.stats{display:flex;gap:18px}.stat{font-size:10px;color:var(--muted);text-align:center}.stat b{display:block;font-size:23px;line-height:1.3;color:var(--ink);font-variant-numeric:tabular-nums}.board-wrap{position:relative;padding:14px;border-radius:28px;background:#e4ebd8;box-shadow:0 14px 0 #d2dcc5,0 22px 35px #34513312;border:1px solid #d6e0cc}canvas{display:block;width:100%;height:auto;aspect-ratio:1;max-height:510px;border-radius:18px;touch-action:none}.message{min-height:40px;margin:26px 0 10px;text-align:center;font-size:13px;color:#627563}.toolbar{display:flex;gap:10px;justify-content:center}.toolbar button{padding:10px 16px;font-size:13px}.dpad{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(2,43px);gap:5px;justify-content:center;margin:18px auto 0}.dpad button{font-size:23px;background:#f1f3e7;box-shadow:0 3px 0 #d8e0cc}.dpad button:first-child{grid-column:2}.dpad button:nth-child(2){grid-column:1;grid-row:2}.dpad button:nth-child(3){grid-column:2;grid-row:2}.dpad button:nth-child(4){grid-column:3;grid-row:2}.footer{text-align:center;font-size:11px;color:#84927e;margin-top:14px}.win{position:absolute;inset:14px;border-radius:18px;background:#f8fbefdF;backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;text-align:center;padding:20px}.win[hidden]{display:none}.win .flower{font-size:54px}.win h3{font-size:30px;margin:10px}.win p{font-size:14px;line-height:1.8}.win button{background:var(--green);color:white;padding:13px 25px;border:0}.win button.secondary{background:#e6eddc;color:var(--ink);margin:8px}.spark{color:#d39538}.legend{display:flex;gap:16px;justify-content:center;font-size:11px;color:#738470;margin:16px 0 0}.legend i{display:inline-block;width:10px;height:10px;background:#e6a95f;border-radius:2px;margin-right:5px}.legend .goal{background:#faf0b8;border:2px solid #c89547;border-radius:50%}
@media(min-width:900px){.dpad{grid-template-columns:repeat(3,42px);grid-template-rows:repeat(2,34px);margin-top:12px}canvas{aspect-ratio:1.15}}
@media(max-width:760px){header{padding:16px 18px}.edition{letter-spacing:1px;font-size:9px}main{display:block;padding:0 16px;margin-top:8px}.eyebrow,.intro,.rules{display:none}h1{font-size:25px;margin:0 0 12px}h1 br{display:none}.levels{display:flex;gap:7px;margin:0 0 20px}.level{flex:1;padding:10px 7px;gap:7px;border-radius:12px}.level .num{font-size:15px}.level strong{font-size:12px}.level small{font-size:9px}.badge{display:none}.topline h2{font-size:16px}.stat b{font-size:20px}.stats{gap:12px}.board-wrap{padding:9px;border-radius:20px}canvas{max-height:46vh}.message{margin-top:22px;font-size:12px;min-height:30px}.toolbar button{padding:9px 14px}.dpad{margin-top:12px}.footer{margin-bottom:env(safe-area-inset-bottom,10px)}.win{inset:9px}.win h3{font-size:24px}.win .flower{font-size:36px}.win p{margin:8px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<header><div class="brand"><span>▧</span>箱子小花園</div><div class="edition">A LITTLE PUZZLE BREAK</div></header>
<main><aside><div class="eyebrow">PUSH · THINK · BLOOM</div><h1>慢慢推，<br>剛剛好。</h1><p class="intro">把散落的木箱送回金色標記。<br>動手之前，先想好下一步。</p><nav class="levels" aria-label="選擇關卡"></nav><div class="rules"><b>小小規則，大大學問</b><br>① 將所有木箱推到金色圓圈。<br>② 一次只能推一箱，不能拉回。<br>③ 卡住了？復原一步，再試一次。<br><br><b>鍵盤</b>　方向鍵 / WASD<br><b>快捷鍵</b>　Z 復原 · R 重來<br><b>手機</b>　下方方向按鈕 / 棋盤滑動</div></aside>
<section class="play-area"><div class="topline"><h2 id="level-title"></h2><div class="stats"><div class="stat">步數<b id="moves">0</b></div><div class="stat">已歸位<b id="goals">0 / 1</b></div></div></div><div class="board-wrap"><canvas id="board" width="720" height="720" role="img" aria-label="推箱子棋盤：使用方向鍵或下方按鈕操作"></canvas><div class="win" id="win" hidden><div><div class="flower">🌼</div><div class="eyebrow">NICELY DONE</div><h3 id="win-title">每一箱，都剛剛好。</h3><p id="win-copy"></p><button id="next">下一個小挑戰 →</button><br><button class="secondary" id="replay">再挑戰一次</button></div></div></div><div class="legend"><span><i></i>木箱</span><span><i class="goal"></i>目的地</span><span>● 綠帽小園丁</span></div><div class="message" id="message" role="status" aria-live="polite"></div><div class="toolbar"><button id="undo">↶ 復原一步</button><button id="restart">↻ 重新開始</button><button id="hint">✧ 提示</button></div><div class="dpad" aria-label="移動方向"><button data-dir="U" aria-label="向上">↑</button><button data-dir="L" aria-label="向左">←</button><button data-dir="D" aria-label="向下">↓</button><button data-dir="R" aria-label="向右">→</button></div><div class="footer">沒有倒數，按照自己的步調來。<span id="best"></span></div></section></main>
<script id="model">
const LEVELS=[
{name:'第一箱的旅行',sub:'01 · 暖身練習',hint:'走到木箱左邊，向右推到金色圓圈。',map:['#######','#     #','#     #','# @$ .#','#     #','#     #','#######']},
{name:'兩箱的默契',sub:'02 · 換個方向',hint:'兩個目的地都在上方。試著從木箱下方往上推。',map:['#######','# . . #','#     #','# $ $ #','#  @  #','#     #','#######']},
{name:'花園小迷宮',sub:'03 · 想好再推',hint:'先把右邊的箱子往上送，再繞到左箱下方。小心別把箱子推進角落。',map:['########','#  . . #','#  #   #','# $  $ #','#   #  #','#  @   #','#      #','########']}
];
const DIR={U:[0,-1],D:[0,1],L:[-1,0],R:[1,0]};
function createState(level){const walls=[],goals=[],boxes=[];let player;level.map.forEach((row,y)=>[...row].forEach((c,x)=>{const p=y*row.length+x;if(c==='#')walls.push(p);if(c==='.')goals.push(p);if(c==='$')boxes.push(p);if(c==='@')player=p}));return {width:level.map[0].length,height:level.map.length,walls,goals,boxes,player,moves:0};}
function won(s){return s.boxes.every(p=>s.goals.includes(p));}
function advance(s,dir){if(won(s))return null;const [dx,dy]=DIR[dir],x=s.player%s.width,y=Math.floor(s.player/s.width),nx=x+dx,ny=y+dy;if(nx<0||nx>=s.width||ny<0||ny>=s.height)return null;const n=ny*s.width+nx;if(s.walls.includes(n))return null;const boxes=[...s.boxes];if(boxes.includes(n)){const bx=nx+dx,by=ny+dy,b=by*s.width+bx;if(bx<0||bx>=s.width||by<0||by>=s.height||s.walls.includes(b)||boxes.includes(b))return null;boxes[boxes.indexOf(n)]=b;}return {...s,player:n,boxes,moves:s.moves+1};}
</script>
<script>
let current=0,state,history=[],records={};try{records=JSON.parse(localStorage.getItem('box-garden-v1')||'{}')||{}}catch{}
const $=id=>document.getElementById(id),canvas=$('board'),ctx=canvas.getContext('2d');
function rounded(x,y,w,h,r,fill){ctx.fillStyle=fill;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();}
function draw(){const W=720,H=720;ctx.clearRect(0,0,W,H);ctx.fillStyle='#e4ebd8';ctx.fillRect(0,0,W,H);const t=Math.min(680/state.width,680/state.height),ox=(W-state.width*t)/2,oy=(H-state.height*t)/2;for(let y=0;y<state.height;y++)for(let x=0;x<state.width;x++){const p=y*state.width+x,X=ox+x*t,Y=oy+y*t;if(state.walls.includes(p)){rounded(X+3,Y+9,t-6,t-10,12,'#799a70');rounded(X+3,Y+2,t-6,t-12,12,'#a3bc8c');rounded(X+9,Y+5,t-18,5,3,'#b9cda6');ctx.fillStyle='#8eac7c';ctx.beginPath();ctx.arc(X+t*.67,Y+t*.54,4,0,7);ctx.fill();}else{rounded(X+2,Y+2,t-4,t-4,9,(x+y)%2?'#f3f0df':'#f8f5e7');if(state.goals.includes(p)){ctx.strokeStyle='#d0a45e';ctx.lineWidth=3;ctx.setLineDash([5,5]);ctx.beginPath();ctx.arc(X+t/2,Y+t/2,t*.27,0,7);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#d7b471';ctx.beginPath();ctx.arc(X+t/2,Y+t/2,5,0,7);ctx.fill();}}}
state.boxes.forEach(p=>{const x=ox+p%state.width*t,y=oy+Math.floor(p/state.width)*t,g=state.goals.includes(p);rounded(x+10,y+16,t-20,t-20,9,g?'#60895b':'#bc7f43');rounded(x+10,y+9,t-20,t-20,8,g?'#93b479':'#e6b575');ctx.strokeStyle=g?'#638c52':'#bd874f';ctx.lineWidth=4;ctx.strokeRect(x+18,y+17,t-36,t-36);ctx.beginPath();ctx.moveTo(x+20,y+19);ctx.lineTo(x+t-20,y+t-21);ctx.moveTo(x+t-20,y+19);ctx.lineTo(x+20,y+t-21);ctx.stroke();if(g){rounded(x+t/2-12,y+t/2-12,24,24,12,'#fbf7d7');ctx.fillStyle='#4b7446';ctx.font='bold 19px sans-serif';ctx.textAlign='center';ctx.fillText('✓',x+t/2,y+t/2+7);}});
const px=ox+state.player%state.width*t+t/2,py=oy+Math.floor(state.player/state.width)*t+t/2;ctx.fillStyle='#344f3220';ctx.beginPath();ctx.ellipse(px,py+t*.3,t*.27,t*.1,0,0,7);ctx.fill();rounded(px-t*.2,py,t*.4,t*.32,12,'#45795b');rounded(px-t*.23,py-t*.24,t*.46,t*.4,14,'#f2c69e');ctx.fillStyle='#243f33';for(const d of [-1,1]){ctx.beginPath();ctx.arc(px+d*t*.09,py-t*.03,2.5,0,7);ctx.fill();}rounded(px-t*.25,py-t*.37,t*.5,t*.2,12,'#477355');rounded(px-t*.34,py-t*.23,t*.68,t*.09,4,'#345a43');rounded(px+t*.12,py-t*.35,t*.08,t*.08,2,'#ecd37e');}
function nav(){document.querySelector('.levels').innerHTML=LEVELS.map((l,i)=>`<button class="level ${current===i?'active':''}" data-level="${i}" aria-current="${current===i?'step':'false'}"><span class="num">0${i+1}</span><span><strong>${l.name}</strong><small>${l.sub.split(' · ')[1]}</small></span><span class="badge">${records[i]?'✓':'↗'}</span></button>`).join('');document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>load(+b.dataset.level));}
function render(){draw();$('moves').textContent=state.moves;$('goals').textContent=state.boxes.filter(p=>state.goals.includes(p)).length+' / '+state.goals.length;$('undo').disabled=!history.length;$('level-title').textContent=LEVELS[current].name;$('best').textContent=records[current]?' 最佳：'+records[current]+' 步':'';$('win').hidden=!won(state);nav();}
function load(i){current=i;state=createState(LEVELS[i]);history=[];$('message').textContent=LEVELS[i].hint;render();}
function move(d){const next=advance(state,d);if(!next){if(!won(state))$('message').textContent='這邊推不動，試試另一個方向。';return;}history.push(state);state=next;$('message').textContent='把每個木箱，送回它的位置。';const trapped=state.boxes.some(p=>!state.goals.includes(p)&&(state.walls.includes(p-1)||state.walls.includes(p+1))&&(state.walls.includes(p-state.width)||state.walls.includes(p+state.width)));if(trapped)$('message').textContent='木箱卡進角落了！按「復原一步」就能救回來。';if(won(state)){records[current]=Math.min(records[current]||Infinity,state.moves);try{localStorage.setItem('box-garden-v1',JSON.stringify(records))}catch{}$('win-title').textContent=current===2?'花園整理完成！':'每一箱，都剛剛好。';$('win-copy').textContent=`用了 ${state.moves} 步，完成 ${state.goals.length} 個木箱歸位。`;$('next').textContent=current===2?'回到第一關 →':'下一個小挑戰 →';$('message').textContent='過關！也可以復原一步，繼續研究更短的路線。';}render();}
function undo(){if(history.length){state=history.pop();$('message').textContent='回到上一步，換個想法再試。';render();}}
$('undo').onclick=undo;$('restart').onclick=()=>load(current);$('replay').onclick=()=>load(current);$('next').onclick=()=>load((current+1)%LEVELS.length);$('hint').onclick=()=>{$('message').textContent=LEVELS[current].hint};document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>move(b.dataset.dir));
addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;const d={ArrowUp:'U',ArrowDown:'D',ArrowLeft:'L',ArrowRight:'R',w:'U',s:'D',a:'L',d:'R'}[e.key]||{w:'U',s:'D',a:'L',d:'R'}[e.key.toLowerCase()];if(d){e.preventDefault();move(d)}else if(e.key.toLowerCase()==='z'){e.preventDefault();undo()}else if(e.key.toLowerCase()==='r'){e.preventDefault();load(current)}});
let touchStart=null;canvas.addEventListener('pointerdown',e=>{touchStart={x:e.clientX,y:e.clientY,id:e.pointerId};canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointerup',e=>{if(!touchStart||touchStart.id!==e.pointerId)return;const dx=e.clientX-touchStart.x,dy=e.clientY-touchStart.y;touchStart=null;if(Math.max(Math.abs(dx),Math.abs(dy))<18)return;move(Math.abs(dx)>Math.abs(dy)?dx>0?'R':'L':dy>0?'D':'U')});canvas.addEventListener('pointercancel',()=>touchStart=null);
load(0);
if(new URLSearchParams(location.search).has('qa'))window.gameQA={read:()=>JSON.parse(JSON.stringify(state)),load,move,undo,levels:LEVELS};
</script></body></html>
