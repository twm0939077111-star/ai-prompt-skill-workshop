<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><rect width="1600" height="900" rx="30" fill="#F7F8FC"/><text x="800" y="38" text-anchor="middle" font-family="Microsoft JhengHei,sans-serif" font-size="22" font-weight="700"><tspan fill="#7A5AE0">定位</tspan><tspan fill="#8A90A2">　＋　</tspan><tspan fill="#E8503A">主視覺</tspan><tspan fill="#8A90A2">　＋　</tspan><tspan fill="#46B083">藝術指導</tspan><tspan fill="#8A90A2">　＋　</tspan><tspan fill="#E0A23A">文案</tspan><tspan fill="#8A90A2">　＋　</tspan><tspan fill="#5B8DEF">限制</tspan></text>
<g><rect x="24" y="58" width="764" height="394" rx="24" fill="#FFF" stroke="#75BDB6" stroke-width="3"/><image href="../user-media/liquid-beauty.png" x="48" y="126" width="184" height="270" preserveAspectRatio="xMidYMid slice"/><text x="48" y="100" font-family="Microsoft JhengHei,sans-serif" font-size="22" font-weight="800" fill="#37958C">01｜超現實水光肌・Liquid Beauty</text><foreignObject x="258" y="108" width="500" height="310"><div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;font-family:'Microsoft JhengHei',sans-serif;font-size:23px;line-height:1.4;color:#244743;"><div><b style="color:#7A5AE0">【定位】</b>超現實水光肌醫美廣告。<b style="color:#E8503A">【主視覺】</b>人物與液態玻璃、水滴、珍珠漂浮。<b style="color:#46B083">【藝術指導】</b>銀白、透明、淡粉的 3D 商業視覺。<b style="color:#E0A23A">【文案】</b>GLOW FROM WITHIN／令肌膚，自帶光。<b style="color:#5B8DEF">【限制】</b>資訊少量、高級留白。</div></div></foreignObject></g>
<g><rect x="812" y="58" width="764" height="394" rx="24" fill="#FFF" stroke="#F08AB5" stroke-width="3"/><image href="../user-media/y2k-1.png" x="836" y="126" width="184" height="270" preserveAspectRatio="xMidYMid slice"/><text x="836" y="100" font-family="Microsoft JhengHei,sans-serif" font-size="22" font-weight="800" fill="#D64786">02｜粉色 Y2K 年輕醫美</text><foreignObject x="1046" y="108" width="500" height="310"><div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;font-family:'Microsoft JhengHei',sans-serif;font-size:23px;line-height:1.4;color:#4D2638;"><div><b style="color:#7A5AE0">【定位】</b>IG／Facebook 年輕客群。<b style="color:#E8503A">【主視覺】</b>活潑人物與大型優惠價格。<b style="color:#46B083">【藝術指導】</b>Baby Pink、Chrome、壓克力、星星。<b style="color:#E0A23A">【文案】</b>今天開始，比昨天更漂亮 ♡／$5,999。<b style="color:#5B8DEF">【限制】</b>避免傳統端莊醫美姿勢。</div></div></foreignObject></g>
<g><rect x="24" y="478" width="764" height="394" rx="24" fill="#FFF" stroke="#9AB8EF" stroke-width="3"/><image href="../user-media/2-04d82a505191.png" x="48" y="546" width="184" height="270" preserveAspectRatio="xMidYMid slice"/><text x="48" y="520" font-family="Microsoft JhengHei,sans-serif" font-size="22" font-weight="800" fill="#5578C8">03｜未來感醫美實驗室</text><foreignObject x="258" y="528" width="500" height="310"><div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;font-family:'Microsoft JhengHei',sans-serif;font-size:23px;line-height:1.4;color:#27324A;"><div><b style="color:#7A5AE0">【定位】</b>專業科技＋醫療感。<b style="color:#E8503A">【主視覺】</b>女性正臉、掃描線、肌膚分析 UI。<b style="color:#46B083">【藝術指導】</b>銀白冰藍、玻璃、3D 球體、光線折射。<b style="color:#E0A23A">【文案】</b>SKIN RE:START。<b style="color:#5B8DEF">【限制】</b>避免電競風，維持精品感。</div></div></foreignObject></g>
<g><rect x="812" y="478" width="764" height="394" rx="24" fill="#FFF" stroke="#A784E2" stroke-width="3"/><image href="../user-media/the-new-me.png" x="836" y="546" width="184" height="270" preserveAspectRatio="xMidYMid slice"/><text x="836" y="520" font-family="Microsoft JhengHei,sans-serif" font-size="22" font-weight="800" fill="#7650BD">04｜醫美雜誌封面・The New Me</text><foreignObject x="1046" y="528" width="500" height="310"><div xmlns="http://www.w3.org/1999/xhtml" style="height:100%;display:flex;align-items:center;font-family:'Microsoft JhengHei',sans-serif;font-size:23px;line-height:1.4;color:#3C3050;"><div><b style="color:#7A5AE0">【定位】</b>時尚雜誌封面。<b style="color:#E8503A">【主視覺】</b>超大人物，標題穿插人像前後。<b style="color:#46B083">【藝術指導】</b>期刊編號、細線、Editorial Typography。<b style="color:#E0A23A">【文案】</b>THE／NEW／ME；SKIN／LIFT／CONTOUR。<b style="color:#5B8DEF">【限制】</b>不直接模仿品牌版面。</div></div></foreignObject></g></svg>
