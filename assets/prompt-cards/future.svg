<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1100"><defs><clipPath id="p"><rect x="42" y="138" width="716" height="260" rx="24"/></clipPath></defs><rect width="800" height="1100" rx="42" fill="#EEF5FF"/><rect x="42" y="42" width="716" height="1016" rx="32" fill="#FFF" stroke="#9AB8EF" stroke-width="3"/><text x="76" y="102" font-family="Microsoft JhengHei,sans-serif" font-size="23" font-weight="700" fill="#5578C8">03 · FUTURE LAB</text><image href="../user-media/2-04d82a505191.png" x="42" y="138" width="716" height="260" preserveAspectRatio="xMidYMid slice" clip-path="url(#p)"/><text x="76" y="452" font-family="Microsoft JhengHei,sans-serif" font-size="34" font-weight="800" fill="#17233D">未來感醫美實驗室</text><foreignObject x="76" y="488" width="648" height="500"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:'Microsoft JhengHei',sans-serif;font-size:24px;line-height:1.5;color:#27324A;">請製作一張醫美診所 Facebook 廣告圖，<b style="color:#5578C8">定位為專業科技＋醫療感</b>。主視覺使用女性正面臉部，周圍加入細緻掃描線與肌膚分析 UI。背景使用銀白、冰藍與半透明玻璃，加入 3D 球體、玻璃材質與光線折射。治療資訊設計成「分析數據卡」。主標為 <b>SKIN RE:START</b>，中文標題為「啟動肌膚新生計畫」。避免電競科技風，維持醫美精品感。</div></foreignObject><text x="76" y="1028" font-family="Microsoft JhengHei,sans-serif" font-size="20" fill="#5578C8">完整 Prompt｜可直接複製使用</text></svg>
