<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect width="1600" height="900" rx="32" fill="#F7F8FC"/>
<g><rect x="24" y="24" width="764" height="414" rx="26" fill="#FFF" stroke="#75BDB6" stroke-width="3"/><image href="../user-media/liquid-beauty.png" x="48" y="86" width="190" height="300" preserveAspectRatio="xMidYMid slice"/><text x="48" y="66" font-family="Microsoft JhengHei,sans-serif" font-size="22" font-weight="800" fill="#37958C">01｜超現實水光肌・Liquid Beauty</text><foreignObject x="264" y="84" width="494" height="320"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:'Microsoft JhengHei',sans-serif;font-size:23px;line-height:1.42;color:#244743;">請製作一張超現實水光肌主題的醫美 Facebook 廣告。人物周圍改用透明液態玻璃、水滴、珍珠與半透明凝膠漂浮，視覺化水潤、光澤與彈性。使用銀白、透明與淡粉的 3D 商業視覺。主標 <b>GLOW FROM WITHIN</b>，小標「令肌膚，自帶光。」資訊保持少量與高級留白。</div></foreignObject></g>
<g><rect x="812" y="24" width="764" height="414" rx="26" fill="#FFF" stroke="#F08AB5" stroke-width="3"/><image href="../user-media/y2k-1.png" x="836" y="86" width="190" height="300" preserveAspectRatio="xMidYMid slice"/><text x="836" y="66" font-family="Microsoft JhengHei,sans-serif" font-size="22" font-weight="800" fill="#D64786">02｜粉色 Y2K 年輕醫美</text><foreignObject x="1052" y="84" width="494" height="320"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:'Microsoft JhengHei',sans-serif;font-size:23px;line-height:1.42;color:#4D2638;">請製作一張適合 IG／Facebook 年輕客群的醫美廣告。使用 Baby Pink、銀色 Chrome、透明壓克力與閃亮星星；人物姿勢活潑。主標「今天開始，比昨天更漂亮 ♡」。將優惠價格 <b>$5,999</b> 放大為視覺焦點，搭配貼紙、愛心與閃亮符號，強化 Y2K 與商業促銷感。</div></foreignObject></g>
<g><rect x="24" y="462" width="764" height="414" rx="26" fill="#FFF" stroke="#9AB8EF" stroke-width="3"/><image href="../user-media/2-04d82a505191.png" x="48" y="524" width="190" height="300" preserveAspectRatio="xMidYMid slice"/><text x="48" y="504" font-family="Microsoft JhengHei,sans-serif" font-size="22" font-weight="800" fill="#5578C8">03｜未來感醫美實驗室</text><foreignObject x="264" y="522" width="494" height="320"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:'Microsoft JhengHei',sans-serif;font-size:23px;line-height:1.42;color:#27324A;">請製作一張專業科技＋醫療感的醫美 Facebook 廣告。女性正面臉部周圍加入掃描線與肌膚分析 UI。背景使用銀白、冰藍、半透明玻璃、3D 球體與光線折射；療程資訊做成數據卡。主標 <b>SKIN RE:START</b>，避免電競科技風，維持醫美精品感。</div></foreignObject></g>
<g><rect x="812" y="462" width="764" height="414" rx="26" fill="#FFF" stroke="#A784E2" stroke-width="3"/><image href="../user-media/the-new-me.png" x="836" y="524" width="190" height="300" preserveAspectRatio="xMidYMid slice"/><text x="836" y="504" font-family="Microsoft JhengHei,sans-serif" font-size="22" font-weight="800" fill="#7650BD">04｜醫美雜誌封面・The New Me</text><foreignObject x="1052" y="522" width="494" height="320"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:'Microsoft JhengHei',sans-serif;font-size:23px;line-height:1.42;color:#3C3050;">請把醫美 Facebook 廣告做成時尚雜誌封面。人物放大，主標分三行 <b>THE／NEW／ME</b>，穿插在人像前後。只放 SKIN／LIFT／CONTOUR，加入期刊編號、細線與 Editorial Typography。呈現韓國時尚雜誌氛圍，但不直接模仿品牌版面，要有設計師作品集感。</div></foreignObject></g>
</svg>
