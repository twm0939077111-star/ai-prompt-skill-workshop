<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1100"><defs><clipPath id="p"><rect x="42" y="138" width="716" height="260" rx="24"/></clipPath></defs><rect width="800" height="1100" rx="42" fill="#FFF0F7"/><rect x="42" y="42" width="716" height="1016" rx="32" fill="#FFF" stroke="#F08AB5" stroke-width="3"/><text x="76" y="102" font-family="Microsoft JhengHei,sans-serif" font-size="23" font-weight="700" fill="#D64786">02 · PINK Y2K</text><image href="../user-media/y2k-1.png" x="42" y="138" width="716" height="260" preserveAspectRatio="xMidYMid slice" clip-path="url(#p)"/><text x="76" y="452" font-family="Microsoft JhengHei,sans-serif" font-size="34" font-weight="800" fill="#421A2E">粉色 Y2K 年輕醫美</text><foreignObject x="76" y="488" width="648" height="500"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:'Microsoft JhengHei',sans-serif;font-size:30px;line-height:1.38;color:#4D2638;">請製作一張吸睛、適合 IG／Facebook 年輕客群的醫美廣告。整體使用 <b style="color:#D64786">Baby Pink、銀色 Chrome、透明壓克力與閃亮星星</b>，呈現粉色 Y2K 社群感。人物姿勢活潑，不使用傳統醫美端莊站姿。主標為「今天開始，比昨天更漂亮 ♡」。優惠價格 <b>$5,999</b> 要放大成主要視覺焦點，搭配貼紙、愛心與閃亮符號，強化年輕、潮流與商業促銷感。</div></foreignObject><text x="76" y="1028" font-family="Microsoft JhengHei,sans-serif" font-size="20" fill="#D64786">完整 Prompt｜可直接複製使用</text></svg>
