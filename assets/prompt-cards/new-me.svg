<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1100"><defs><clipPath id="p"><rect x="42" y="138" width="716" height="260" rx="24"/></clipPath></defs><rect width="800" height="1100" rx="42" fill="#F7F2FF"/><rect x="42" y="42" width="716" height="1016" rx="32" fill="#FFF" stroke="#A784E2" stroke-width="3"/><text x="76" y="102" font-family="Microsoft JhengHei,sans-serif" font-size="23" font-weight="700" fill="#7650BD">04 · THE NEW ME</text><image href="../user-media/the-new-me.png" x="42" y="138" width="716" height="260" preserveAspectRatio="xMidYMid slice" clip-path="url(#p)"/><text x="76" y="452" font-family="Microsoft JhengHei,sans-serif" font-size="34" font-weight="800" fill="#2D2140">醫美雜誌封面</text><foreignObject x="76" y="488" width="648" height="500"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:'Microsoft JhengHei',sans-serif;font-size:24px;line-height:1.5;color:#3C3050;">請把醫美 Facebook 廣告做成一本<b style="color:#7650BD">時尚雜誌封面</b>。人物放得非常大，標題穿插在人像前後，主標分成三行：<b>THE／NEW／ME</b>。旁邊只放少量資訊：SKIN／LIFT／CONTOUR，再加入期刊編號、細線與 Editorial Typography。整體偏 Vogue 與韓國時尚雜誌 Editorial 氛圍，但不要直接模仿任何品牌版面。成品要有平面設計師作品集感，不像單純 AI 生成的漂亮人物照。</div></foreignObject><text x="76" y="1028" font-family="Microsoft JhengHei,sans-serif" font-size="20" fill="#7650BD">完整 Prompt｜可直接複製使用</text></svg>
